services:
  ctf-platform:
    profiles: ["legacy-v0"]
    build: ./platform
    container_name: ctf-platform
    environment:
      FLAG_1: "FLAG{sql_bypass_4e91}"
      FLAG_2: "FLAG{path_traverse_9c02}"
      FLAG_3: "FLAG{cmd_inject_77b3}"
      FLAG_4: "FLAG{ssti_render_11aa}"
      FLAG_5: "FLAG{alg_none_forged_22bb}"
      FLAG_6: "FLAG{idor_invoice_33cc}"
      FLAG_7: "FLAG{debug_panel_44dd}"
      FLAG_8: "FLAG{b64_admin_55ee}"
      FLAG_9: "FLAG{regex_fullmatch_66ff}"
      FLAG_10: "FLAG{mass_assign_77aa}"
      FLAG_11: "FLAG{xxe_entity_88bb}"
      FLAG_12: "FLAG{pickle_rce_99cc}"
      FLAG_13: "FLAG{xff_trust_a0dd}"
      FLAG_14: "FLAG{verb_put_e1ee}"
      FLAG_15: "FLAG{backup_listing_f2ff}"
      FLAG_16: "FLAG{md5_time_a3aa}"
      FLAG_17: "FLAG{hpp_lastwins_b4bb}"
      FLAG_18: "FLAG{ssrf_local_c5cc}"
      FLAG_19: "FLAG{union_select_d6dd}"
      FLAG_20: "FLAG{fmt_inject_e7ee}"
    ports:
      - "${CTF_BIND:-127.0.0.1}:${PLATFORM_PORT:-8000}:8000"
    volumes:
      - ctf-db:/data
    restart: unless-stopped

  busted-login:
