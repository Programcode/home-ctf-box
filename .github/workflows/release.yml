name: release

# Tag-driven release pipeline: builds the three production images, pushes
# them to GHCR under the version tag plus latest, then creates a GitHub
# Release whose assets are syft-generated SPDX SBOMs and a changelog built
# from git history since the previous tag.
#
# Cut a release:
#   git tag -a vX.Y.Z -m "vX.Y.Z" && git push origin vX.Y.Z

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: docker/Dockerfile.api
          - component: web
            dockerfile: docker/Dockerfile.web
          - component: gateway
            dockerfile: docker/Dockerfile.gateway
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires lowercase image paths.
      - name: Resolve image references
        run: echo "IMAGE_BASE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push openrange-${{ matrix.component }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/openrange-${{ matrix.component }}:${{ github.ref_name }}
            ${{ env.IMAGE_BASE }}/openrange-${{ matrix.component }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  github-release:
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Generate changelog since previous tag
        run: |
          set -euo pipefail
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          {
            echo "# ${GITHUB_REF_NAME}"
            echo
            echo "Changes since ${PREV}:"
            echo
            git log --no-decorate --date=short --pretty=format:'- %h %ad %s (%an)' "${PREV}..${GITHUB_REF_NAME}"
            echo
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Generate API image SBOM (syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ env.IMAGE_BASE }}/openrange-api:${{ github.ref_name }}
          format: spdx-json
          artifact-name: openrange-api-sbom
          upload-artifact: false
          output-file: openrange-api-sbom.spdx.json

      - name: Generate web image SBOM (syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ env.IMAGE_BASE }}/openrange-web:${{ github.ref_name }}
          format: spdx-json
          artifact-name: openrange-web-sbom
          upload-artifact: false
          output-file: openrange-web-sbom.spdx.json

      - name: Generate gateway image SBOM (syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ env.IMAGE_BASE }}/openrange-gateway:${{ github.ref_name }}
          format: spdx-json
          artifact-name: openrange-gateway-sbom
          upload-artifact: false
          output-file: openrange-gateway-sbom.spdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          body_path: RELEASE_NOTES.md
          files: |
            openrange-api-sbom.spdx.json
            openrange-web-sbom.spdx.json
            openrange-gateway-sbom.spdx.json
