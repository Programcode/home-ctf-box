[project]
name = "openrange-config"
version = "0.1.0"
description = "Typed, fail-closed configuration for OpenRange services"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "pydantic-settings>=2.6"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openrange"]
