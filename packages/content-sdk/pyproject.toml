[project]
name = "cyberrange"
version = "0.1.0"
description = "OpenRange content SDK: schemas, lints, solver harness, and the cyberrange CLI"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "jsonschema>=4.23",
  "pyyaml>=6.0",
  "httpx>=0.28",
  "typer>=0.15",
  "rich>=13.9",
  "docker>=7.1",
  "openrange-config",
]

[project.scripts]
cyberrange = "openrange.content.cli:app"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openrange"]

[tool.uv.sources]
openrange-config = { workspace = true }
