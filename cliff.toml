# Changelog is generated from Conventional Commits (see CONTRIBUTING.md).
# Config for git-cliff: https://git-cliff.org
[changelog]
header = "# Changelog\n\n"
body = """
{% for group, commits in commits | group_by(attribute="group") %}
## {{ group }}

{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }} {% if commit.remote.pr_number %}(#{{
  commit.remote.pr_number }}){% endif %}{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9].*"

[git.commit_parsers]
message = [
  { message = "^feat(\\([^)]*\\))?!?:", group = "Added" },
  { message = "^fix(\\([^)]*\\))?!?:", group = "Fixed" },
  { message = "^perf(\\([^)]*\\))?!?:", group = "Performance" },
  { message = "^docs(\\([^)]*\\))?!?:", group = "Documentation" },
  { message = "^refactor(\\([^)]*\\))?!?:", group = "Changed" },
  { message = "^content(\\([^)]*\\))?!?:", group = "Content" },
  { message = "^test(\\([^)]*\\))?!?:", group = "Testing" },
  { message = "^(chore|ci|build)(\\([^)]*\\))?!?:", group = "Maintenance" },
]

[git.filter]
regexes = []
