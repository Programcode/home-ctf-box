[project]
name = "openrange-runner"
version = "0.1.0"
description = "OpenRange lab runner agent: authenticated lifecycle control for lab instances"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "docker>=7.1",
  "pydantic>=2.9",
  "openrange-config",
]

[project.scripts]
openrange-runner = "openrange.runner.main:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openrange"]

[tool.uv.sources]
openrange-config = { workspace = true }
