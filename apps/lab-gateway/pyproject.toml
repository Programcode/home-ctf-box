[project]
name = "openrange-gateway"
version = "0.1.0"
description = "OpenRange lab gateway: authenticated HTTP proxy and browser terminal for lab instances"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "httpx>=0.28",
  "asyncssh>=2.21,<3",
  "pydantic>=2.9",
  "pydantic-settings>=2.7",
]

[project.scripts]
openrange-gateway = "openrange.gateway.main:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "aiohttp>=3.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openrange"]
