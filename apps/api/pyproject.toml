[project]
name = "openrange-api"
version = "0.1.0"
description = "OpenRange control-plane API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.34",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "webauthn>=2.2",
  "itsdangerous>=2.2",
  "redis>=5.2",
  "httpx>=0.28",
  "openrange-config",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "asgi-lifespan>=2.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openrange"]

[tool.uv.sources]
openrange-config = { workspace = true }
