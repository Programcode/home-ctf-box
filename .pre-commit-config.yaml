repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: '^(LICENSE|licenses/|docs/evidence/)'
      - id: trailing-whitespace
        exclude: '\.md$|^docs/evidence/'
      - id: check-yaml
        exclude: '^\.hermes/'
      - id: check-toml
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  # mirrors-prettier is deprecated upstream; run the pinned local prettier.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: pnpm exec prettier --write --ignore-unknown
        language: system
        types_or: [ts, tsx, javascript, jsx, json, yaml, css]
