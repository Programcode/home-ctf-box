apiVersion: openrange.io/v1
kind: Room
metadata:
  slug: dvwa-cmdi
  title: 'DVWA: Command Injection, Low and Slow'
  version: 1.0.0
  difficulty: easy
  points: 100
  estimated_minutes: 35
  tags: [dvwa, cmdi, rce, php]
spec:
  track: web-foundations
  type: guided
  summary: >-
    Damn Vulnerable Web Application runs as its official upstream container,
    paired with the MariaDB service its own compose file declares. Log in as
    admin, drop the security level to low through DVWA's own UI mechanics,
    and make the ping tool echo back a word of your choosing.
  objectives:
    - 'Authenticate to DVWA with its default credentials and initialize its database.'
    - 'Change the security level to low using the DVWA security page.'
    - 'Abuse the Command Injection level to make the server echo an answer token.'
  prerequisites: []
  scope:
    allowed_targets:
      - 'http://target:80'
    forbidden: [control-plane, other-labs, internet, host]
  safety:
    simulated_only: true
    no_real_malware: true
    reviewer_notes: 'Runs the official unmodified digininja/dvwa image plus the mariadb companion from the upstream compose topology, isolated with no egress.'
  target:
    external_image: 'ghcr.io/digininja/dvwa@sha256:38d8f4894c9ec064e42e43eaf423d55ad09a7f59cada82414217113db6129c3e'
    sidecars:
      - name: db
        image: 'library/mariadb@sha256:8020e05c4c498d06c87f0a1db010eb79bd6f8fb30e9b763d4690c34ce1e61008'
        env:
          MYSQL_ROOT_PASSWORD: dvwa
          MYSQL_DATABASE: dvwa
          MYSQL_USER: dvwa
          MYSQL_PASSWORD: 'p@ssw0rd'
    ports: [80]
    env:
      DB_SERVER: db
    healthcheck:
      http_path: /login.php
      timeout_seconds: 180
    flag_delivery: static
  workstation: terminal
  tasks:
    - id: cmdi-echo
      title: 'Make the ping tool echo your word'
      prompt: >-
        Sign in to DVWA as admin with the default password, set the security
        level to low, open the Command Injection level, and append a shell
        command so the server prints the word pwned under the ping output.
        Submit pwned as your answer.
      points: 100
      hints:
        - cost: 0
          text: 'Fresh containers need one visit to setup.php and its Create / Reset Database button before admin/password works.'
        - cost: 10
          text: 'The ping form concatenates your input into a shell command. A semicolon starts a second command; try 127.0.0.1;echo pwned.'
        - cost: 25
          text: 'POST ip=127.0.0.1;echo+pwned with Submit=Submit to /vulnerabilities/exec/ while logged in at low security. The response shows pwned below the ping lines.'
      solution: |
        1. Browse to http://target/setup.php and click Create / Reset
           Database once the service is up. Default sign-in is admin with
           password "password".
        2. Open DVWA Security (left menu), pick low, and click Submit.
           This sets the security cookie through the app itself.
        3. Open Command Injection. The level shells out to ping.
        4. Enter 127.0.0.1;echo pwned as the IP address and press Submit.
        5. The page renders ping output followed by pwned inside the
           results block. Submit pwned.
      validator:
        type: exact
        value: 'pwned'
