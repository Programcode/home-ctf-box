# Simulated Windows-network Samba configuration.
[global]
workgroup = SIMDOMAIN
server string = SIMFILE01 (training simulation)
log file = /var/log/samba/log.%m
max log size = 1000
server role = standalone server
map to guest = Bad User

# Public drop zone: browseable, no credentials.
[public]
path = /srv/samba/public
browseable = yes
guest ok = yes
read only = yes
force group = sharegrp

# Hidden development share; deliberately absent from browse lists.
# Access still requires valid credentials, hidden is not protected.
[dev$]
path = /srv/samba/dev$
browseable = no
valid users = smbuser
read only = yes
force group = sharegrp
