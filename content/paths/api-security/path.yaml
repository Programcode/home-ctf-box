apiVersion: openrange.io/v1
kind: Path
metadata:
  slug: api-security
  title: 'API Security'
  version: 0.1.0
  difficulty: medium
  points: 450
  estimated_minutes: 210
  tags:
    - apis
    - rest
    - graphql
    - oauth
    - jwt
    - bola
spec:
  track: web-foundations
  summary: >-
    Modern applications are APIs wearing a website as a coat. This track
    teaches you to map REST and GraphQL surfaces, read OAuth2 and OIDC flows
    well enough to spot broken token handling, and lab the JWT confusion tricks
    that keep signing keys out of the fight. You practice object-level
    authorization testing with two accounts, push extra fields through
    mass-assignable endpoints, respect rate limits while probing them, and
    close with a repeatable API testing methodology that produces reports a
    developer can act on. The mass-assign room is your capstone: one JSON patch,
    one extra field, and a profile that says more than it should.
  modules:
    - slug: rest-graphql-surfaces
    - slug: oauth-tokens-bola
    - slug: api-methodology
  capstones:
    - mass-assign
