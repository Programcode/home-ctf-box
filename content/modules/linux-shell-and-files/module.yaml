apiVersion: openrange.io/v1
kind: Module
metadata:
  slug: linux-shell-and-files
  title: 'Linux shell and files'
  version: 0.1.0
  difficulty: easy
  points: 150
  estimated_minutes: 65
  tags:
    - shell
    - files
    - permissions
    - find
    - tar
spec:
  track: linux-networking
  summary: >-
    The shell is where Linux operators live. This module builds real fluency:
    moving and inspecting with intent, reading and searching text, chaining
    commands with pipes and redirection, decoding and changing file
    permissions, and finding or archiving anything on disk fast. A guided mini
    lab and a checkpoint lock the skills in place.
  objectives:
    - Navigate and inspect directories using globs, quoting, and listing options.
    - Read, search, count, and redirect text through pipelines confidently.
    - Decode ls -l output and change permissions with both symbolic and octal modes.
    - Locate files by name, size, age, or permission with find.
    - Create and extract tar.gz archives without looking up the flags.
    - Complete a timed mini lab that combines navigation, permissions, and search.
  sections:
    - id: navigate-with-intent
      title: 'Navigate with intent'
      blocks:
        - type: prose
          markdown: |
            Beginners walk the filesystem one cd at a time. Operators move with
            patterns. The shell expands wildcards before a command ever runs,
            so `ls *.log` asks for every name ending in .log, `mv report?.txt`
            touches report1.txt but not report10.txt, and `[a-c]*` matches names
            starting with a, b, or c. Quoting controls all of it: double quotes
            allow variable expansion inside, single quotes forbid it entirely.

            Two more habits separate fluent from fumbling. Brace expansion
            writes pairs of paths cheaply, as in `mkdir -p lab/{raw,clean}`.
            And history substitution is not just the up arrow: pressing
            Ctrl+R lets you search old commands by fragment, which matters once
            your history holds hundreds of lines you would rather not retype.

            One warning keeps this fluency safe. Wildcards expand before the
            command runs, so `rm *` in the wrong directory deletes everything
            visible without asking. Operators glance at `pwd` before any glob
            touching destructive commands, a two-second check that has saved
            more careers than any backup policy.
        - type: code
          language: bash
          code: |
            $ mkdir -p lab/{raw,clean} && touch lab/raw/a.log lab/raw/b.log
            $ ls lab/raw/
            a.log  b.log

            $ echo "home is $HOME" ; echo 'home is $HOME'
            home is /home/lab
            home is $HOME
        - type: callout
          tone: tip
          markdown: |
            When a wildcard refuses to match because of spaces in filenames,
            quote the whole pattern argument or use tab completion. Tab
            completion escapes spaces correctly every single time.
    - id: read-search-and-redirect
      title: 'Read, search, redirect'
      blocks:
        - type: prose
          markdown: |
            Text is the universal interface on Linux, and four verbs manage it.
            View files with cat for short output or less for long ones. Search
            with grep: `-i` ignores case, `-n` numbers lines, `-r` recurses
            into directories, `-v` inverts the match. Count things with wc and
            its line, word, and character flags.

            Redirection decides where streams go. Every command has standard
            output on descriptor 1 and standard error on 2. `command > out`
            captures stdout into a file, `>>` appends instead of truncating,
            `2>` captures errors alone, and `2>&1` merges them. Pipes connect
            programs so each does one job: sort feeds uniq, grep feeds wc, and
            chains of three small tools routinely replace scripts.
        - type: code
          language: bash
          code: |
            $ printf 'alpha\nBeta\nalpha\n' > words.txt
            $ sort words.txt | uniq -c
                  2 alpha
                  1 Beta

            $ grep -c alpha words.txt
            2

            $ find /etc -name '*.conf' 2>/dev/null | wc -l
            412
        - type: prose
          markdown: >
            That last pipeline deserves a second look. find walks /etc looking
            for .conf files, permission complaints go down the drain via
            2>/dev/null, and wc -l counts what survives. Reading pipelines
            left to right like a sentence is the core literacy this module is
            building, and every later module assumes you have it.
    - id: permissions-are-the-lock-system
      title: 'Permissions are the lock system'
      blocks:
        - type: prose
          markdown: |
            Every file carries an owner, a group, and a nine-character mode
            string such as rwxr-x---. Read it as three triplets: owner, group,
            others. Each triplet grants read, write, and execute. Directories
            use the same letters with shifted meaning, where execute means
            enter and read means list names. Understanding this string is not
            optional knowledge; misread permissions explain most failed access
            attempts on Linux.

            Change modes symbolically with who and what, as in
            `chmod u+x deploy.sh`, or numerically with three octal digits where
            read is 4, write is 2, and execute is 1. So 640 gives the owner
            read and write, the group read only, and everyone else nothing.
            `chown user:group FILE` moves ownership and usually needs sudo.
        - type: code
          language: bash
          code: |
            $ ls -l deploy.sh
            -rw-r--r-- 1 lab lab 84 Aug 23 11:02 deploy.sh

            $ chmod u+x,g-w deploy.sh && ls -l deploy.sh
            -rwxr--r-- 1 lab lab 84 Aug 23 11:02 deploy.sh

            $ chmod 640 secret.env && stat -c '%a %n' secret.env
            640 secret.env
        - type: quiz
          question_id: perm-decode-750
          question: 'What does the mode rwxr-x--- (750) grant?'
          options:
            - id: a
              text: 'Owner full, group read and enter, others nothing'
            - id: b
              text: 'Everyone full control'
            - id: c
              text: 'Group full, owner read only, others read'
            - id: d
              text: 'Owner read and write, group nothing, others execute'
          answer_ids: [a]
          explanation: >
            Splitting rwxr-x--- into triplets gives owner rwx, group r-x, and
            others no bits at all. Numerically that is 7, 5, 0, hence chmod 750.
        - type: callout
          tone: warning
          markdown: |
            A missing execute bit on a directory hides everything inside it
            even when read remains granted. If listing works but opening any
            entry fails with Permission denied, check for exactly this case.
    - id: find-and-archive
      title: 'Find anything, archive safely'
      blocks:
        - type: prose
          markdown: |
            find searches the live filesystem by almost any property. By name
            with `-name '*.log'`, by size with `-size +100M`, by age with
            `-mtime -7` for the last week, and by mode with `-perm`. It also
            acts on results directly: `-exec COMMAND {} \;` runs a command per
            hit, which turns find into a batch processor rather than a mere
            searcher. Add `-type f` or `-type d` to restrict to files or
            directories and silence noise with 2>/dev/null when crossing
            system directories.

            Archiving pairs tar with gzip. Create with `tar czf out.tar.gz
            DIR`, extract with `tar xzf out.tar.gz`, list contents harmlessly
            with `tar tzf`. The z flag means gzip compression, c creates, x
            extracts, t lists, and f names the archive file. Extracting into a
            directory you own beats extracting over system paths, because
            archives can contain absolute-looking relative paths that overwrite
            things you did not intend to lose. A quick hash of the archive
            before shipping it anywhere gives the recipient a way to verify the
            copy survived the trip, which ties straight back to the evidence
            habits from your foundations module.
        - type: code
          language: bash
          code: |
            $ find ~/lab -type f -name '*.log' -size +0c | sort
            /home/lab/lab/raw/a.log
            /home/lab/lab/raw/b.log

            $ tar czf lab-backup.tar.gz lab/ && tar tzf lab-backup.tar.gz
            lab/
            lab/raw/
            lab/raw/a.log
            lab/raw/b.log
            lab/clean/
    - id: practice-mini-lab
      title: 'Practice: the evidence drop'
      blocks:
        - type: prose
          markdown: |
            Do this sequence in your own terminal now, without copying blindly.
            Build a small tree, stage a file with deliberate permissions, then
            prove your work with inspection commands. The point is not the
            result but the loop: act, verify, note. Operators trust nothing they
            did not just print to the screen.

            Step one creates the scene. Step two plants a file that pretends to
            hold credentials, locked to its owner. Steps three and four audit
            the state so your notebook entry contains proof rather than memory.
            Time yourself; under two minutes is fluent.

            Then break it on purpose and observe. Drop the execute bit from the
            case01 directory and try to list its contents again. The failure you
            provoke teaches the permission model more honestly than another page
            of reading, and restoring the bit afterward is one command. Deliberate
            breakage in your own lab is free education; the same mistake during
            an engagement is an incident report.
        - type: code
          language: bash
          code: |
            $ mkdir -p case01/{images,logs} && echo 'user:pass' > case01/logs/creds.txt
            $ chmod 600 case01/logs/creds.txt && chmod 750 case01
            $ stat -c '%a %n' case01 case01/logs/creds.txt
            750 case01
            600 case01/logs/creds.txt

            $ find case01 -type f -exec sha256sum {} \;
            a1b2c3...  case01/logs/creds.txt
        - type: callout
          tone: tip
          markdown: |
            Notice how the final command hashes every file under the case
            directory in one line. You built an evidence fingerprint pass using
            nothing but find and exec, which is precisely the habit from the
            ethics module wearing working clothes.
    - id: checkpoint-shell-fluency
      title: 'Checkpoint: shell fluency'
      blocks:
        - type: prose
          markdown: |
            Before moving to users and services, confirm the load-bearing ideas
            survived contact with practice. These questions target the exact
            failure modes beginners bring to the next module: misreading modes,
            losing stream discipline, and trusting archives unverified.
        - type: quiz
          question_id: shell-octal-604
          question: 'chmod 604 report.txt produces which access?'
          options:
            - id: a
              text: 'Owner read and write, group none, others read only'
            - id: b
              text: 'Owner read only, group read and write, others none'
            - id: c
              text: 'Owner read, write and execute, others read'
            - id: d
              text: 'Invalid octal, the command fails'
          answer_ids: [a]
          explanation: >
            Octal digits sum the values 4 for read, 2 for write, 1 for execute.
            6 is rw, 0 is nothing, 4 is r. So 604 reads as rw for owner, blank
            for group, and r for others.
        - type: quiz
          question_id: shell-stream-merge
          question: 'Which redirection captures both stdout and stderr into one file?'
          options:
            - id: a
              text: 'command > out 2> err'
            - id: b
              text: 'command &> out'
            - id: c
              text: 'command >> out'
            - id: d
              text: 'command < out'
          answer_ids: [b]
          explanation: >
            The shorthand &> sends both streams to the same destination. Option
            a splits them across two files, option b appends only stdout, and
            option d feeds a file into stdin.
        - type: quiz
          question_id: shell-tar-list
          question: 'You downloaded lab.tar.gz from a teammate. What runs first?'
          options:
            - id: a
              text: 'tar xzf lab.tar.gz straight into /'
            - id: b
              text: 'tar tzf lab.tar.gz to inspect the paths inside'
            - id: c
              text: 'chmod 777 lab.tar.gz for compatibility'
            - id: d
              text: 'gunzip then delete the original immediately'
          answer_ids: [b]
          explanation: >
            Listing first reveals whether entries are plain names, hidden dot
            files, or hostile absolute paths. Inspection costs one second and
            prevents overwriting files you care about.
  cheat_sheet: |
    # Linux shell and files

    Move and list:
        pwd ; ls -la ; cd DIR       # orientation
        ls * ; mv a?.txt ../        # globs
        mkdir -p a/b/c              # nested create

    Streams and search:
        cmd > f   append: >>        errors: 2>
        merge:    &> or 2>&1
        grep -rn PATTERN DIR      wc -l
        sort F | uniq -c

    Permissions:
        rwx = 421                   rwxr-x--- = 750
        chmod u+x FILE ; chmod 640 FILE
        chown user:group FILE       (sudo)
        dirs need x to enter even if r is set

    Find and archive:
        find DIR -type f -name '*.log' -size +100M -mtime -7
        find DIR -perm /4000 -exec ls -l {} \;
        tar czf OUT.tar.gz DIR      tar xzf IN.tar.gz
        tar tzf IN.tar.gz           # always list first
