# OpenRange production profile: single-node Community Edition.
#
# Run from the repository root (the --env-file flag feeds variable
# interpolation; the services read the repo-root .env via env_file):
#
#   cp .env.example .env   # fill in generated secrets, see docs/deployment.md
#   docker compose -f infra/compose/production.yml --env-file .env \
#     up -d postgres redis minio meilisearch
#   docker compose -f infra/compose/production.yml --env-file .env run --rm migrate
#   docker compose -f infra/compose/production.yml --env-file .env up -d --wait
#
# Everything binds to loopback only; Caddy is the sole public edge when you
# point OPENRANGE_DOMAIN at this host (automatic HTTPS) or override
# CADDY_HTTP_BIND / CADDY_HTTPS_BIND.

name: ${COMPOSE_PROJECT_NAME:-openrange-prod}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openrange}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generate one - openssl rand -hex 32}
      POSTGRES_DB: ${POSTGRES_DB:-openrange}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Loopback-only operator access; never publish to a public interface.
      - '127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - internal
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '60', '1', '--loglevel', 'warning']
    volumes:
      - redis-data:/data
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-16379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - internal
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m

  minio:
    image: quay.io/minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${OPENRANGE_S3_ACCESS_KEY:?set OPENRANGE_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${OPENRANGE_S3_SECRET_KEY:?generate one - openssl rand -hex 32}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - internal
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m

  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${OPENRANGE_MEILI_MASTER_KEY:?generate one - openssl rand -hex 32}
      MEILI_NO_ANALYTICS: 'true'
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:7700/health | grep -q available']
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - internal
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m

  api:
    image: ${OPENRANGE_API_IMAGE:-ghcr.io/openrange/openrange-api:latest}
    build:
      context: ../..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    env_file: ../../.env
    environment:
      OPENRANGE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-openrange}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-openrange}
      OPENRANGE_REDIS_URL: redis://redis:6379/0
      OPENRANGE_S3_ENDPOINT: http://minio:9000
      CONTENT_DIR: /app/content
    volumes:
      # Content ships as data, not baked into the image: update room bundles
      # without rebuilding the API.
      - ../../content:/app/content:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
      - edge
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 768m

  migrate:
    image: ${OPENRANGE_API_IMAGE:-ghcr.io/openrange/openrange-api:latest}
    build:
      context: ../..
      dockerfile: docker/Dockerfile.api
    command: ['alembic', 'upgrade', 'head']
    env_file: ../../.env
    environment:
      OPENRANGE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-openrange}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-openrange}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ['ops']
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
    logging: *default-logging

  web:
    image: ${OPENRANGE_WEB_IMAGE:-ghcr.io/openrange/openrange-web:latest}
    build:
      context: ../..
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    env_file: ../../.env
    environment:
      # Server-side fetches go straight to the API over the internal network;
      # browsers only ever talk to the same-origin /api/or/* proxy route.
      ORIGIN_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    ports:
      - '127.0.0.1:${WEB_HOST_PORT:-3100}:3100'
    networks:
      - edge
      - internal
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 384m

  gateway:
    image: ${OPENRANGE_GATEWAY_IMAGE:-ghcr.io/openrange/openrange-gateway:latest}
    build:
      context: ../..
      dockerfile: docker/Dockerfile.gateway
    restart: unless-stopped
    env_file: ../../.env
    environment:
      RUNNER_URL: ${RUNNER_URL:-http://lab-runner:8771}
    depends_on:
      api:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      # No domain configured: serve plain HTTP for ANY host on :80 (loopback
      # trials, or running behind your own proxy). A real DNS name (e.g.
      # range.example.com) switches the site to automatic Let's Encrypt
      # HTTPS with an HTTP->HTTPS redirect.
      OPENRANGE_DOMAIN: ${OPENRANGE_DOMAIN:-:80}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ['CMD', 'caddy', 'validate', '--config', '/etc/caddy/Caddyfile']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 5
    ports:
      - '${CADDY_HTTP_BIND:-127.0.0.1:8080}:80'
      - '${CADDY_HTTPS_BIND:-127.0.0.1:8443}:443'
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
      gateway:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128m

networks:
  # internal: databases and caches; no direct route from the edge proxy
  # except through the api service.
  internal:
  # edge: services that answer user traffic via caddy.
  edge:

volumes:
  postgres-data:
  redis-data:
  minio-data:
  meili-data:
  caddy-data:
  caddy-config:
