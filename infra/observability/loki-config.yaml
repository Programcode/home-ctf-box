# Single-node Loki for local development. No auth, filesystem storage,
# data lives in the loki-data volume. Query with Grafana Explore or:
#   docker compose -f infra/compose/observability.yml exec loki \
#     logcli query '{container_name=~"openrange.*"}' --addr=http://localhost:3100

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
