# Promtail ships docker container logs into Loki. Only containers that
# opt in with the label `logging=promtail` are picked up, so noisy room
# containers stay out of the log store until someone wants them.
#
# The docker json-file driver wraps each line as {"log","stream","time"};
# the pipeline unwraps it so Loki stores the raw application line and
# keeps stdout/stderr as a label.

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ['logging=promtail']
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container_name
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: compose_service
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            timestamp: time
      - labels:
          stream:
      - output:
          source: output
