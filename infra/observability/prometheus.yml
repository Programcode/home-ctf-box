# Prometheus scrape configuration for the local OpenRange stack.
# The api target resolves inside the `openrange` compose network once an
# api service runs there. For host-run uvicorn development, see
# docs/operations.md for the host.docker.internal alternative.

global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: openrange-api
    metrics_path: /api/metrics
    static_configs:
      - targets: ['api:8000']

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
